name: "Go & Terraform Enterprise Deployment"

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: "1. pull latest git code"
        uses: actions/checkout@v4

      - name: "2. init go env"
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: "3. run unit test"
        run: go test ./...

      - name: '4. build docker image and add label'
        run: |
          docker build -t my-go-app:${{ github.sha }} .
          echo "image my-app-go:${{ github.sha }} pack success"

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: "1. pull code again"
        uses: actions/checkout@v4

      - name: "2. install and config Terraform CLI tool"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: "3. driver init (terraform init)"
        run: terraform init

      - name: "4. generage upgrade plan (terraform plan)"
        run: terraform plan -var="app_version=${{ github.sha }}" -out=tfplan

      - name: "5. online update (terraform apply)"
        run: terraform apply -auto-approve tfplan
